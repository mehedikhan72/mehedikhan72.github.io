<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Lato, Verdana, Helvetica, sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- stage box helper positions: two columns of 4 -->
  <!-- Column 1 -->
  <g font-size="20" fill="#222">
    <rect x="60" y="40" width="330" height="60" rx="6" fill="#fff" stroke="#1772d0" stroke-width="2"/>
    <text x="225" y="76" text-anchor="middle">Input C (subset)</text>

    <rect x="60" y="150" width="330" height="60" rx="6" fill="#fff" stroke="#1772d0" stroke-width="2"/>
    <text x="225" y="180" text-anchor="middle">Lexical Analyzer</text>
    <text x="225" y="200" text-anchor="middle" font-size="14" fill="#666">Flex (yyFlex)</text>

    <rect x="60" y="260" width="330" height="60" rx="6" fill="#fff" stroke="#1772d0" stroke-width="2"/>
    <text x="225" y="296" text-anchor="middle">Tokens</text>

    <rect x="60" y="370" width="330" height="60" rx="6" fill="#fff" stroke="#1772d0" stroke-width="2"/>
    <text x="225" y="400" text-anchor="middle">Parser</text>
    <text x="225" y="420" text-anchor="middle" font-size="14" fill="#666">ANTLR4 (C++)</text>

    <rect x="60" y="480" width="330" height="60" rx="6" fill="#fff" stroke="#1772d0" stroke-width="2"/>
    <text x="225" y="516" text-anchor="middle">Abstract Syntax Tree</text>
  </g>

  <!-- vertical arrows column 1 -->
  <g stroke="#888" stroke-width="2" marker-end="url(#arrow)">
    <line x1="225" y1="100" x2="225" y2="146"/>
    <line x1="225" y1="210" x2="225" y2="256"/>
    <line x1="225" y1="320" x2="225" y2="366"/>
    <line x1="225" y1="430" x2="225" y2="476"/>
  </g>

  <!-- connector from column1 bottom to column2 top -->
  <path d="M390 510 H 520 V 100" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 2 -->
  <g font-size="20" fill="#222">
    <rect x="410" y="40" width="330" height="60" rx="6" fill="#fff" stroke="#1772d0" stroke-width="2"/>
    <text x="575" y="76" text-anchor="middle">Symbol Table</text>
    <text x="575" y="96" text-anchor="middle" font-size="14" fill="#666" display="none"></text>

    <rect x="410" y="150" width="330" height="60" rx="6" fill="#fff" stroke="#1772d0" stroke-width="2"/>
    <text x="575" y="176" text-anchor="middle">Semantic Analysis</text>
    <text x="575" y="196" text-anchor="middle" font-size="14" fill="#666">+ Intermediate Code Gen (ANTLR visitor)</text>

    <rect x="410" y="260" width="330" height="60" rx="6" fill="#1772d0" stroke="#1772d0" stroke-width="2"/>
    <text x="575" y="296" text-anchor="middle" fill="#fff">x86 Assembly Output</text>

    <rect x="410" y="370" width="330" height="60" rx="6" fill="#fff" stroke="#bbb" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="575" y="400" text-anchor="middle" font-size="16" fill="#666">Runs in EMU8086 / DOSBox</text>
  </g>

  <g stroke="#888" stroke-width="2" marker-end="url(#arrow)">
    <line x1="575" y1="100" x2="575" y2="146"/>
    <line x1="575" y1="210" x2="575" y2="256"/>
    <line x1="575" y1="320" x2="575" y2="366"/>
  </g>
</svg>
