bio: |
  I am a final-year undergraduate in Computer Science and Engineering at [Bangladesh University of Engineering and Technology (BUET)](https://www.buet.ac.bd/). My interests are primarily in Distributed Systems, ML Systems and Applied AI - building software that stays correct and cheap under load.

  I have previously worked part-time as an AI Engineer at [CreateBud, Inc.](https://www.createbudinc.com/), a Research Assistant at [Sysmodeler.ai](https://sysmodeler.ai/) on Model-Based Systems Engineering and AI-based SysML generation, and a Backend Engineer at [Systemica Institut](https://systemica-institut.de/). On the side, I work as a software consultant and freelance for small and mid-size businesses, and contribute to open source - including a merged PR to [Plone](https://github.com/plone).

  I've competed a few times in my undergraduate years - winning the [IEEE ICIP 2025 VIP Cup](https://2025.ieeeicip.org/ieee-sps-video-and-image-processing-cup/) and the AI Engineering Hackathon (poridhi.io × Brain Station 23). I have tutored university and college students for three years, chaired the technical committee at IEEE CS BUET SBC, and now serve as its Vice Chairperson (Technical). Outside engineering I travel, lift and listen to far too much music - I [write](/blogs/) about all of it. If you want to talk, just shoot me an email!
