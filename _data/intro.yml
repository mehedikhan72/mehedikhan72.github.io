bio: |
  I am a final-year undergraduate in Computer Science and Engineering at [Bangladesh University of Engineering and Technology (BUET)](https://www.buet.ac.bd/). My interests are primarily in Distributed Systems, ML Systems and Applied AI — building software that stays correct and cheap under load. I have been writing software professionally for three years, mostly on the backend and infrastructure side.

  Most recently I led systems, backend and infrastructure for [Netra News'](https://www.netra.news/) live election monitoring platform for the 2026 Bangladesh national election, which served roughly 8 million requests at 100% uptime across 300 constituencies and ~43,000 polling stations. I currently work part-time as an AI Engineer at [CreateBud, Inc.](https://www.createbudinc.com/), and have previously built a file-processing API at [Systemica Institut](https://systemica-institut.de/) and worked on Model-Based Systems Engineering and AI-based SysML generation at [Sysmodeler.ai](https://sysmodeler.ai/). Alongside that I freelance for small and mid-size businesses and contribute to open source — [Apache Seata](https://github.com/apache/incubator-seata), [Open edX](https://github.com/openedx/edx-platform), [Plone](https://github.com/plone).

  I compete and I teach. Team NeuronX, which I was part of, won the [IEEE ICIP 2025 VIP Cup](https://2025.ieeeicip.org/ieee-sps-video-and-image-processing-cup/) for real-time multimodal drone detection, and I presented our solution in Anchorage, Alaska. I have tutored university and school students for three years and chaired the technical committee at IEEE CS BUET SBC. Outside engineering I travel, lift and listen to far too much music — I [write](/blogs/) about all of it. If you want to talk, just shoot me an email!
