# Newest first.
- title: "QuizCube RAG System"
  context: "Client Project (proprietary)"
  year: 2026
  image: /assets/img/quizcube-rag-pipeline.svg
  meta: "Client project · 2026"
  blurb: >
    A production RAG backend for an ed-tech platform covering Bangladesh's NCTB higher-secondary
    curriculum (Physics, Chemistry, Math, Biology). Three idempotent Celery pipelines share one
    corpus: one OCRs textbooks, chunks them, classifies them against a 1,075-topic taxonomy and
    embeds them into Qdrant; a second retrieves grounding chunks and generates new bilingual
    (Bangla/English) MCQs, with figures the model draws as sanitized SVG; a third ingests scanned
    past papers end to end - extraction, Bangla-aware answer-key binding, retrieval-grounded answer
    resolution, and bilingual explanations. Every MCQ from either path clears a semantic-dedup check
    and a cross-model LLM judge before it's stored; on a 96-MCQ benchmark, 90/96 came out usable at
    a judge mean of 8.2/10, for about $0.02 per usable question. Built a provider-agnostic LLM layer
    (OpenAI/Anthropic) that treats model output as untrusted input - structured-output schemas,
    per-field validators and graceful degradation at every layer - plus Celery delivery guarantees
    (acks_late, reject_on_worker_lost) so a crashed worker never loses or duplicates a job. Stack:
    FastAPI, Celery, PostgreSQL, Qdrant, Docker, DigitalOcean behind Caddy TLS. Thorough unit and
    e2e test coverage, with GitHub Actions CI (lint, e2e against live APIs, migration-drift check,
    dependency audit) and automatic deploy on every passing push. Proprietary client work - code
    isn't shareable.

- title: "Live Election Monitoring System"
  context: "Netra News"
  year: 2026
  image: /assets/blog/election-monitor-system-netranews-3.webp
  meta: "Netra News · 2026"
  links:
    - label: "Blog Post"
      url: /blogs/election-monitor-system-netranews/
  blurb: >
    Systems, backend and infrastructure lead for Netra News' live election monitoring platform
    covering Bangladesh's 2026 national election - 300 constituencies, ~43,000 polling stations.
    Built as a static Next.js site using Incremental Static Regeneration, triggered by authenticated
    webhooks on each result entry, backed by a FastAPI monolith and a PostgreSQL primary/replica pair
    with two-layer connection pooling. Deployed on a DigitalOcean Kubernetes cluster behind Cloudflare
    (WAF, DDoS protection, Tunnels in place of a load balancer). Served roughly 8 million requests at
    100% uptime for about $335 in infrastructure cost for the month.

- title: "Compiler"
  context: "Compiler Design, BUET"
  year: 2025
  image: /assets/img/compiler-pipeline.svg
  meta: "Compiler Design, BUET · 2025"
  links:
    - label: "Github"
      url: https://github.com/mehedikhan72/CSE310-Compiler
  blurb: >
    A full compiler for a subset of C, built for CSE310: Compiler Design. Complete pipeline - Flex
    lexical analysis, ANTLR4 parsing, a custom C++ symbol table, semantic analysis and
    intermediate-code generation via ANTLR visitors - down to x86 assembly that runs on EMU8086 and
    DOSBox.

