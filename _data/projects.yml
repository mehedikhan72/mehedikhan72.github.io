# Newest first.
- title: "Live Election Monitoring System"
  context: "Netra News"
  year: 2026
  image: /assets/blog/election-monitor-system-netranews-3.webp
  meta: "Netra News · 2026"
  links:
    - label: "Blog Post"
      url: /blogs/election-monitor-system-netranews/
  blurb: >
    Systems, backend and infrastructure lead for Netra News' live election monitoring platform
    covering Bangladesh's 2026 national election - 300 constituencies, ~43,000 polling stations.
    Built as a static Next.js site using Incremental Static Regeneration, triggered by authenticated
    webhooks on each result entry, backed by a FastAPI monolith and a PostgreSQL primary/replica pair
    with two-layer connection pooling. Deployed on a DigitalOcean Kubernetes cluster behind Cloudflare
    (WAF, DDoS protection, Tunnels in place of a load balancer). Served roughly 8 million requests at
    100% uptime for about $335 in infrastructure cost for the month.

- title: "Compiler"
  context: "Compiler Design, BUET"
  year: 2025
  image: /assets/img/compiler-pipeline.svg
  meta: "Compiler Design, BUET · 2025"
  links:
    - label: "Github"
      url: https://github.com/mehedikhan72/CSE310-Compiler
  blurb: >
    A full compiler for a subset of C, built for CSE310: Compiler Design. Complete pipeline - Flex
    lexical analysis, ANTLR4 parsing, a custom C++ symbol table, semantic analysis and
    intermediate-code generation via ANTLR visitors - down to x86 assembly that runs on EMU8086 and
    DOSBox.

