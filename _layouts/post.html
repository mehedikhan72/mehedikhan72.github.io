---
layout: default
---
<a class="back-link" href="{{ '/blogs/' | relative_url }}">&larr; Back to all articles</a>

<div class="post-header">
  <h1>{{ page.title }}</h1>
  <div class="post-meta">
    {{ page.date | date: "%B %-d, %Y" }} · {{ page.category | capitalize }}
  </div>
</div>

<div class="post-body">
{{ content }}
</div>

<div class="share-row" id="share-row" data-title="{{ page.title | escape }}">
  <span class="share-label">Share</span>
  <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url }}" target="_blank" rel="noopener" aria-label="Share on Facebook">
    <svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>
  </a>
  <a class="share-btn" href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url }}&amp;text={{ page.title | url_encode }}" target="_blank" rel="noopener" aria-label="Share on X">
    <svg viewBox="0 0 24 24"><path d="M18.24 2H21l-6.5 7.43L22.2 22h-6.1l-4.78-6.25L5.8 22H3l6.96-7.95L2 2h6.25l4.32 5.72L18.24 2zm-1.07 18h1.68L7.9 3.9H6.1L17.17 20z"/></svg>
  </a>
  <button type="button" id="copy-link-btn" aria-label="Copy link">
    <svg viewBox="0 0 24 24"><path d="M3.9 12a4.1 4.1 0 0 1 4.1-4.1h4v-1.8h-4a5.9 5.9 0 0 0 0 11.8h4v-1.8h-4A4.1 4.1 0 0 1 3.9 12zM16 6.1h-4v1.8h4a4.1 4.1 0 0 1 0 8.2h-4v1.8h4a5.9 5.9 0 0 0 0-11.8zM8 12.9h8v-1.8H8v1.8z"/></svg>
  </button>
  <span class="toast" id="copy-toast">Link copied</span>
</div>

<script>
(function () {
  var btn = document.getElementById('copy-link-btn');
  var toast = document.getElementById('copy-toast');
  if (!btn) return;
  btn.addEventListener('click', function () {
    navigator.clipboard.writeText(window.location.href).then(function () {
      toast.classList.add('visible');
      setTimeout(function () { toast.classList.remove('visible'); }, 1800);
    });
  });
})();
</script>
