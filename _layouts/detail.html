---
layout: default
---
<div class="detail-header">
  <a class="back-link" href="{{ '/' | relative_url }}#{{ page.section }}">&larr; Back</a>
  <h1>{{ page.title }}</h1>
  {% if page.meta %}<div class="detail-meta">{{ page.meta }}</div>{% endif %}
  {% include link-list.html links=page.links page_url=page.url %}
</div>

{% if page.image %}
<img src="{{ page.image | relative_url }}" alt="{{ page.title }}" style="width:100%;height:auto;border-radius:4px;margin-bottom:24px;">
{% endif %}

<div class="detail-body">
{{ content }}
</div>
